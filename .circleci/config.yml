version: 2.1

executors:
  default:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/project
    resource_class: medium

  macos:
    macos:
      xcode: "16.4.0"
    working_directory: ~/project
    resource_class: macos.m1.medium.gen1

commands:
  attach_project:
    steps:
      - attach_workspace:
          at: ~/project

  install_deps:
    steps:
      - restore_cache:
          keys:
            - yarn-v1-{{ checksum "yarn.lock" }}
            - yarn-v1-
      - run:
          name: Install dependencies
          command: yarn install --immutable
      - save_cache:
          key: yarn-v1-{{ checksum "yarn.lock" }}
          paths:
            - .yarn/cache
            - node_modules
            - example/node_modules

jobs:
  install-dependencies:
    executor: default
    steps:
      - checkout
      - run:
          name: Clone submodules
          command: git submodule update --init --recursive
      - install_deps
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: default
    steps:
      - attach_project
      - run:
          name: Lint files
          command: yarn lint

  typescript:
    executor: default
    steps:
      - attach_project
      - run:
          name: Typecheck files
          command: yarn typecheck

  unit-tests:
    executor: default
    steps:
      - attach_project
      - run:
          name: Run unit tests
          command: yarn test --coverage
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_test_results:
          path: coverage

  build-package:
    executor: default
    steps:
      - attach_project
      - run:
          name: Build package
          command: yarn prepare

  build-android:
    executor: default
    docker:
      - image: cimg/android:2024.10-node
    resource_class: large
    steps:
      - attach_project
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "example/android/gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-v1-
      - run:
          name: Build Android
          command: yarn example build:android
      - save_cache:
          key: gradle-v1-{{ checksum "example/android/gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

  build-ios:
    executor: macos
    steps:
      - attach_project
      - restore_cache:
          keys:
            - pods-v1-{{ checksum "example/ios/Podfile.lock" }}
            - pods-v1-
      - run:
          name: Install CocoaPods
          command: |
            cd example/ios
            bundle install
            bundle exec pod install
      - save_cache:
          key: pods-v1-{{ checksum "example/ios/Podfile.lock" }}
          paths:
            - example/ios/Pods
      - run:
          name: Build iOS
          command: yarn example build:ios

  release-package:
    executor: default
    steps:
      - attach_project
      - run:
          name: Authenticate with registry
          command: npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN

      - run:
          name: Add github.com to known hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Configure git
          command: |
            git config --global user.email "julien.brayere@obitrain.com"
            git config --global user.name "CircleCI"
      - run:
          name: Release to NPM and GitHub
          command: yarn release --ci

workflows:
  build-and-test:
    when:
      not:
        equal: [main, << pipeline.git.branch >>]
    jobs:
      - install-dependencies
      # Run these in parallel after dependencies are installed
      - lint:
          requires:
            - install-dependencies
      - typescript:
          requires:
            - install-dependencies
      - unit-tests:
          requires:
            - install-dependencies
      - build-package:
          requires:
            - install-dependencies
      # Native builds run after package is built
      - build-android:
          requires:
            - build-package
      - build-ios:
          requires:
            - build-package

  release:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - install-dependencies
      - lint:
          requires:
            - install-dependencies
      - typescript:
          requires:
            - install-dependencies
      - unit-tests:
          requires:
            - install-dependencies
      - build-package:
          requires:
            - install-dependencies
      - build-android:
          requires:
            - build-package
      - build-ios:
          requires:
            - build-package
      - release-package:
          requires:
            - lint
            - typescript
            - unit-tests
            - build-package
