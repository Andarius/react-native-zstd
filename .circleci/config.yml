version: 2.1

executors:
  default:
    docker:
      - image: cimg/node:22.14.0
    working_directory: ~/project
    resource_class: medium

commands:
  attach_project:
    steps:
      - attach_workspace:
          at: ~/project

  install_deps:
    steps:
      - restore_cache:
          keys:
            - yarn-v1-{{ checksum "yarn.lock" }}
            - yarn-v1-
      - run:
          name: Install dependencies
          command: yarn install --immutable
      - save_cache:
          key: yarn-v1-{{ checksum "yarn.lock" }}
          paths:
            - .yarn/cache
            - node_modules
            - example/node_modules

jobs:
  install-dependencies:
    executor: default
    steps:
      - checkout
      - run:
          name: Clone submodules
          command: git submodule update --init --recursive
      - install_deps
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: default
    steps:
      - attach_project
      - run:
          name: Lint files
          command: yarn lint

  typescript:
    executor: default
    steps:
      - attach_project
      - run:
          name: Typecheck files
          command: yarn typecheck

  unit-tests:
    executor: default
    steps:
      - attach_project
      - run:
          name: Run unit tests
          command: yarn test --coverage
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_test_results:
          path: coverage

  build-package:
    executor: default
    steps:
      - attach_project
      - run:
          name: Build package
          command: yarn prepare

  release-package:
    executor: default
    steps:
      - attach_project
      - run:
          name: Authenticate with registry
          command: npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN

      - run:
          name: Add github.com to known hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Configure git
          command: |
            git config --global user.email "julien.brayere@obitrain.com"
            git config --global user.name "CircleCI"
      - run:
          name: Release to NPM and GitHub
          command: yarn release --ci

workflows:
  build-and-test:
    when:
      not:
        equal: [main, << pipeline.git.branch >>]
    jobs:
      - install-dependencies
      # Run these in parallel after dependencies are installed
      - lint:
          requires:
            - install-dependencies
      - typescript:
          requires:
            - install-dependencies
      - unit-tests:
          requires:
            - install-dependencies
      - build-package:
          requires:
            - install-dependencies

  release:
    when:
      equal: [main, << pipeline.git.branch >>]
    jobs:
      - install-dependencies
      - lint:
          requires:
            - install-dependencies
      - typescript:
          requires:
            - install-dependencies
      - unit-tests:
          requires:
            - install-dependencies
      - build-package:
          requires:
            - install-dependencies
      - release-package:
          requires:
            - lint
            - typescript
            - unit-tests
            - build-package
