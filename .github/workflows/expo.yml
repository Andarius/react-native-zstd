name: Expo example
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  expo-checks:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --immutable

      - name: Build local library
        run: yarn prepare

      - name: Check Expo dependencies
        working-directory: example
        run: npx --yes expo-doctor@1.20.4 --verbose
        env:
          # patch drift is handled by Renovate after minimumReleaseAge
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1

      - name: Export native bundles
        run: yarn example export

  build-android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --immutable

      - name: Build local library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android project
        run: yarn example prebuild --clean --no-install --platform android

      - name: Build Android example
        run: yarn example build:android

  build-ios:
    runs-on: macos-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: yarn install --immutable

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS example
        run: yarn example build:ios

